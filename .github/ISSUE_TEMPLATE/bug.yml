name: Bug
description: Something on the site doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what did you see instead?
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link
      description: The page where it happened
      placeholder: https://ratingo.top/...
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone, Safari
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image here if you have one
