name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # api and pg-backup run on Railway (node:22 Dockerfiles); web-client runs on Vercel (Node 24.x)
  NODE_VERSION: 22
  WEB_NODE_VERSION: 24
  HUSKY: 0

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      contracts: ${{ steps.filter.outputs.contracts }}
      backup: ${{ steps.filter.outputs.backup }}
      migrations: ${{ steps.filter.outputs.migrations }}
      deps: ${{ steps.filter.outputs.deps }}
      smoke: ${{ steps.filter.outputs.smoke }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "contracts=true" >> "$GITHUB_OUTPUT"
            echo "backup=true" >> "$GITHUB_OUTPUT"
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            echo "deps=$([[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "smoke=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
          count=$(grep -c . <<< "$files" || true)
          echo "$count changed files"

          match() { grep -qE "$1" <<< "$files" && echo true || echo false; }

          large=$(( count >= 3000 ))

          if (( large )) || [[ $(match '^(package\.json|package-lock\.json|tsconfig\.json|eslint\.config\.mjs|eslint-rules/|\.github/)') == true ]]; then
            api=true; web=true; contracts=true; backup=true; migrations=true; smoke=true
          else
            api=$(match '^(apps/api/|knip\.json$)')
            web=$(match '^(apps/web-client/|packages/(api-contract|web-core)/|knip\.json$)')
            contracts=$(match '^(apps/api/|packages/api-contract/)')
            backup=$(match '^apps/pg-backup/')
            migrations=$(match '^apps/api/(drizzle_v2/.*\.sql$|\.squawk\.toml$|src/scripts/lint-migrations\.ts$)')
            smoke=$(match '^(apps/web-client/|packages/(api-contract|web-core)/|e2e/smoke/|playwright\.smoke\.config\.ts$)')
          fi

          if (( large )); then
            deps=true
          else
            deps=$(match '^(package\.json|package-lock\.json|\.npmrc|(apps|packages)/[^/]+/package\.json|\.dockerignore|apps/api/Dockerfile|\.github/(workflows/ci\.yml|scripts/load-native-modules\.cjs))$')
          fi

          echo "api=$api web=$web contracts=$contracts backup=$backup migrations=$migrations deps=$deps smoke=$smoke"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "contracts=$contracts" >> "$GITHUB_OUTPUT"
          echo "backup=$backup" >> "$GITHUB_OUTPUT"
          echo "migrations=$migrations" >> "$GITHUB_OUTPUT"
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
          echo "smoke=$smoke" >> "$GITHUB_OUTPUT"

  api:
    name: api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Tool cache key
        run: echo "TOOL_CACHE_KEY=api-tools-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json', 'eslint-rules/**') }}" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/eslint/api
            apps/api/dist/tsconfig.tsbuildinfo
          key: ${{ env.TOOL_CACHE_KEY }}-${{ github.sha }}
          restore-keys: ${{ env.TOOL_CACHE_KEY }}-

      - name: Lint
        run: npm run lint --workspace=api -- --cache --cache-strategy content --cache-location "$GITHUB_WORKSPACE/.cache/eslint/api"

      - name: Test ESLint rules
        run: npm run test:eslint-rules

      - name: Typecheck
        run: npm run typecheck --workspace=api

      - if: success() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/eslint/api
            apps/api/dist/tsconfig.tsbuildinfo
          key: ${{ env.TOOL_CACHE_KEY }}-${{ github.sha }}

  api-test:
    name: api-test (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Unit tests
        run: npm test --workspace=api -- --ci --shard=${{ matrix.shard }}/2

  api-e2e:
    name: api-e2e
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: E2E tests
        run: npm run test:e2e --workspace=api -- --ci

  api-dead-code:
    name: api-dead-code
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Find unused files, exports and dependencies with knip
        run: npm run lint:dead-code --workspace=api

  migrations:
    name: migrations
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint new and changed migrations with Squawk
        env:
          MIGRATIONS_BASE: HEAD^1
        run: npm run lint:migrations --workspace=api

  api-prod-install:
    name: api-prod-install
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCKERFILE: apps/api/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Full (deps) and production (prod-deps) installs
        run: |
          docker build --progress=plain --platform linux/amd64 -f "$DOCKERFILE" --target deps --output type=cacheonly . > deps.log 2>&1 &
          deps_build=$!
          docker build --progress=plain --platform linux/amd64 -f "$DOCKERFILE" --target prod-deps -t api-prod-deps . > prod-deps.log 2>&1 &
          prod_deps_build=$!
          failed=""
          wait "$deps_build" || failed="$failed deps"
          wait "$prod_deps_build" || failed="$failed prod-deps"
          for stage in deps prod-deps; do
            echo "::group::$stage install log"; cat "$stage.log"; echo "::endgroup::"
          done
          if [[ -n "$failed" ]]; then
            echo "::error file=$DOCKERFILE::npm ci failed in stage(s):$failed"
            grep -h 'npm error' deps.log prod-deps.log | head -40
            exit 1
          fi

      - name: Load native modules from the production install
        run: docker run --rm --platform linux/amd64 -v "$GITHUB_WORKSPACE/.github/scripts:/scripts:ro" api-prod-deps node /scripts/load-native-modules.cjs

  api-audit:
    name: api-audit
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Audit API production dependencies for high and critical advisories
        run: npm audit --omit=dev --workspace=api --audit-level=high

  web-audit:
    name: web-audit
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.WEB_NODE_VERSION }}
          package-manager-cache: false

      - name: Audit web-client production dependencies for high and critical advisories
        run: npm audit --omit=dev --workspace=web-client --workspace=@ratingo/web-core --audit-level=high

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup-deps
        with:
          node-version: ${{ env.WEB_NODE_VERSION }}

      - name: Tool cache key
        run: echo "TOOL_CACHE_KEY=web-tools-${{ runner.os }}-node${{ env.WEB_NODE_VERSION }}-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/jest/web
            apps/web-client/tsconfig.typecheck.tsbuildinfo
          key: ${{ env.TOOL_CACHE_KEY }}-${{ github.sha }}
          restore-keys: ${{ env.TOOL_CACHE_KEY }}-

      - name: Lint
        run: npm run lint --workspace=web-client

      - name: Typecheck
        run: npm run typecheck --workspace=web-client

      - name: Unit tests
        run: npm test --workspace=web-client -- --ci --cacheDirectory "$GITHUB_WORKSPACE/.cache/jest/web"

      - name: web-core lint
        run: npm run lint --workspace=@ratingo/web-core

      - name: web-core typecheck
        run: npm run typecheck --workspace=@ratingo/web-core

      - name: web-core unit tests
        run: npm test --workspace=@ratingo/web-core -- --ci

      - if: success() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/jest/web
            apps/web-client/tsconfig.typecheck.tsbuildinfo
          key: ${{ env.TOOL_CACHE_KEY }}-${{ github.sha }}

  web-dead-code:
    name: web-dead-code
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup-deps
        with:
          node-version: ${{ env.WEB_NODE_VERSION }}

      - name: Find unused files, exports and dependencies with knip
        run: npm run lint:dead-code --workspace=web-client

      - name: Find unused files, exports and dependencies in web-core with knip
        run: npm run lint:dead-code --workspace=@ratingo/web-core

  contracts:
    name: contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Regenerate API contract
        timeout-minutes: 5
        run: npm run contracts:update

      - name: Check contract is up to date
        run: |
          if [ -n "$(git status --porcelain -- packages/api-contract)" ]; then
            git status --short -- packages/api-contract
            git diff -- packages/api-contract
            echo "::error::packages/api-contract is out of date. Run 'npm run contracts:update' and commit the result."
            exit 1
          fi

  pg-backup:
    name: pg-backup
    needs: changes
    if: needs.changes.outputs.backup == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup-deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint
        run: npm run lint --workspace=pg-backup

      - name: Typecheck
        run: npm run typecheck --workspace=pg-backup

      - name: Unit tests
        run: npm test --workspace=pg-backup -- --ci

  web-smoke:
    name: web-smoke
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup-deps
        with:
          node-version: ${{ env.WEB_NODE_VERSION }}

      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Wait for the Vercel preview
        id: preview
        timeout-minutes: 16
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/wait-for-vercel-preview.sh

      - name: Smoke tests against the preview
        timeout-minutes: 5
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:smoke

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-smoke-report
          path: |
            playwright-report/smoke
            e2e/test-results/smoke
          retention-days: 7
          if-no-files-found: ignore

  ci:
    name: ci
    needs: [changes, api, api-test, api-e2e, api-dead-code, api-prod-install, api-audit, migrations, web, web-dead-code, web-audit, contracts, pg-backup, web-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to have run or been skipped by the path filter
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          results=$(echo "$NEEDS" | jq -c 'map_values(if (.result // "") == "" then "none" else .result end)')
          echo "$results" | jq -r 'to_entries[] | "\(.key): \(.value)"'

          changes_result=$(echo "$results" | jq -r '.changes // "none"')
          if [[ "$changes_result" != "success" ]]; then
            echo "::error::changes ended '$changes_result', so no check ran on this commit"
            exit 1
          fi

          not_passed=$(echo "$results" | jq -r '
            to_entries[]
            | select(.key != "changes")
            | select(.value != "success" and .value != "skipped")
            | "\(.key): \(.value)"')
          if [[ -n "$not_passed" ]]; then
            while IFS= read -r job; do
              echo "::error::$job"
            done <<< "$not_passed"
            exit 1
          fi
